name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest flake8
      - name: Validate bot source
        run: python validate_bot.py
      - name: Validate dashboard source
        run: python validate_dashboard.py
      - name: Lint critical errors
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run regression tests
        run: python -m pytest -q
